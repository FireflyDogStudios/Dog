<!doctype html>
<html><head><meta charset="utf-8"><title>Canine SDF</title>
<style>html,body{margin:0;background:#1e2126}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="canine.js"></script>
<script>
// Spark, Oct 8 2026. Raymarches the canine builder's masses in WebGL. Query: ?dog=wolf&mode=clay|coat|flat&yaw=0&w=1600&h=1000
const Q = new URLSearchParams(location.search);
const dog = Canine.build(Canine.PRESETS[Q.get('dog') || 'wolf']);
const mode = Q.get('mode') || 'clay', yaw = +(Q.get('yaw') || 0), Wd = +(Q.get('w') || 1600), Ht = +(Q.get('h') || 1000);
const cv = document.getElementById('c'); cv.width = Wd; cv.height = Ht;
const gl = cv.getContext('webgl', {preserveDrawingBuffer: true, antialias: false});
const f = x => (+x).toFixed(3), v3 = a => `vec3(${f(a[0])},${f(a[1])},${f(a[2])})`;

// one line of GLSL per mass; the smooth union also blends the coat colour
function primCode(q, withCol) {
  let d;
  if (q.t === 0) {
    const c = Math.cos(q.deg * Math.PI / 180), s = Math.sin(q.deg * Math.PI / 180);
    d = `sdEll(p-${v3(q.a)},vec2(${f(c)},${f(s)}),${v3(q.r)})`;
  } else d = `sdCone(p,${v3(q.a)},${v3(q.b)},${f(q.ra)},${f(q.rb)},${f(q.sz)})`;
  return withCol ? `{float e=${d}; float h=clamp(0.5+0.5*(e-d)/${f(q.k)},0.,1.); d=mix(e,d,h)-${f(q.k)}*h*(1.-h); col=mix(${v3(q.rgb)},col,h); w=mix(${f(q.col==='body'||q.col==='back'||q.col==='belly'||q.col==='head'?1:0)},w,h);}`
                 : `{float e=${d}; float h=clamp(0.5+0.5*(e-d)/${f(q.k)},0.,1.); d=mix(e,d,h)-${f(q.k)}*h*(1.-h);}`;
}
const first = dog.prims[0];
const body = dog.prims.map(q => primCode(q, false)).join('\n');
const bodyC = dog.prims.map(q => primCode(q, true)).join('\n');
const W = dog.W, B = dog.bounds;
const fs = `precision highp float;
uniform vec2 res;
float sdEll(vec3 q, vec2 cs, vec3 r){ vec3 l=vec3(q.x*cs.x+q.y*cs.y, -q.x*cs.y+q.y*cs.x, q.z); float k0=length(l/r); float k1=length(l/(r*r)); return k0*(k0-1.0)/max(k1,1e-4); }
float sdCone(vec3 p, vec3 a, vec3 b, float ra, float rb, float sz){ vec3 m=(a+b)*0.5; p.z=m.z+(p.z-m.z)*sz; a.z=m.z+(a.z-m.z)*sz; b.z=m.z+(b.z-m.z)*sz;
  vec3 pa=p-a, ba=b-a; float t=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return (length(pa-ba*t)-mix(ra,rb,t))/sz; }
float map(vec3 p){ float d=1e9; ${body.replace(/\n/g, ' ')} return d-${f(dog.fur)}; }
vec3 colw(vec3 p, out float w){ float d=1e9; vec3 col=vec3(0.5); w=0.; ${bodyC.replace(/\n/g, ' ')} return col; }
vec3 nrm(vec3 p){ vec2 e=vec2(1.0,-1.0)*0.6; return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx)); }
float shadow(vec3 ro, vec3 rd){ float r=1., t=4.; for(int i=0;i<40;i++){ float h=map(ro+rd*t); r=min(r,10.*h/t); t+=clamp(h,4.,60.); if(r<0.01||t>1500.) break; } return clamp(r,0.,1.); }
float ao(vec3 p, vec3 n){ float o=0., s=1.; for(int i=1;i<=5;i++){ float h=float(i)*14.; o+=(h-map(p+n*h))*s; s*=0.6; } return clamp(1.-o/45.,0.,1.); }
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*res)/res.y;
  float yw=${f(yaw * Math.PI / 180)};
  vec3 ta=vec3(${f((B.x0 + B.x1) / 2)},${f(W * 0.52)},0.);
  vec3 ro=ta+vec3(sin(yw),0.06,cos(yw))*${f(W * 9)};
  vec3 fw=normalize(ta-ro), rt=normalize(cross(fw,vec3(0,1,0))), up=cross(rt,fw);
  vec3 rd=normalize(fw*5.4+uv.x*rt+uv.y*up);
  vec3 bg=vec3(0.118,0.129,0.149)+0.03*(1.-length(uv));
  float t=${f(W * 7.5)}, tmax=${f(W * 11)}, dmin=1e9; bool hit=false;
  for(int i=0;i<220;i++){ float d=map(ro+rd*t); dmin=min(dmin,d/t); if(d<0.3){hit=true;break;} t+=d*0.85; if(t>tmax) break; }
  vec3 c=bg;
  if(hit){
    vec3 p=ro+rd*t, n=nrm(p); float w; vec3 alb=colw(p,w);
    vec3 bk=${v3(dog.backRGB)}, bl=${v3(dog.bellyRGB)};
    alb=mix(alb,bk,w*${f(dog.saddle)}*smoothstep(0.35,0.85,n.y));
    alb=mix(alb,bl,w*${f(dog.counter)}*smoothstep(-0.05,-0.6,n.y));
    vec3 L=normalize(vec3(0.45,0.75,0.65)); vec3 L2=normalize(vec3(-0.7,0.25,0.4)); vec3 Lr=normalize(vec3(-0.3,0.4,-0.9));
    float dif=max(dot(n,L),0.), sh=shadow(p+n*2.,L), o=ao(p,n);
    ${mode === 'flat'
      ? `float lit=step(0.18,dif*sh); c=alb*mix(0.72,1.0,lit); c=mix(c,alb*0.62,smoothstep(0.55,0.95,-n.y)*0.5);`
      : `float spec=pow(max(dot(reflect(-L,n),-rd),0.),24.)*0.18; float fil=max(dot(n,L2),0.)*0.35; float rim=pow(1.-max(dot(n,-rd),0.),3.)*0.35*max(dot(n,Lr)+0.5,0.);
         c=alb*(0.18*o+1.05*dif*sh+fil*o)+vec3(spec*sh)+vec3(0.8,0.85,1.0)*rim; c=pow(c,vec3(0.9));`}
  } else if(${mode === 'flat' ? 'true' : 'false'} && dmin<0.0016){ c=vec3(0.07,0.06,0.06); }
  gl_FragColor=vec4(c,1.);
}`;
const vs = 'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}';
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { document.title = 'ERR ' + gl.getShaderInfoLog(s); throw new Error(gl.getShaderInfoLog(s)); } return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const bf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const al = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(pr, 'res'), Wd, Ht);
// draw in horizontal strips so the software renderer never hits a watchdog
gl.enable(gl.SCISSOR_TEST);
const strip = 50; let y = 0;
function step() { if (y >= Ht) { gl.finish(); document.title = 'DONE ' + dog.prims.length; return; } gl.scissor(0, y, Wd, strip); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish(); y += strip; setTimeout(step, 0); }
step();
</script></body></html>
