<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vector-painted storybook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Barlow",system-ui,sans-serif}
a{color:#8a5a2b}a:hover{color:#5a2f17}
</style>
</helmet>
<div style="width: 560px; height: 660px; box-sizing: border-box; padding: 32px 40px; background: #f3e7cf; color: #3a2414; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Spectral SC', Georgia, serif; font-size: 13px; letter-spacing: 0.12em; color: #8a5a2b">Look D · Firefly's pick</div>
<h1 style="margin: 0; font-family: 'Spectral SC', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.1">Vector-painted storybook</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.4">Softer shade, a thinner calmer line, warm paper. Fits the Field Kit panels; the weapons would need a softer outline to match.</p>
</div>
<div style="display: flex; justify-content: center">
<dc-import name="Dingo" look="storybook" hint-size="480px,400px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
<span style="width: 34px; height: 34px; border-radius: 4px; background: #d9823c"></span>
<span style="width: 34px; height: 34px; border-radius: 4px; background: #b25f24"></span>
<span style="width: 34px; height: 34px; border-radius: 4px; background: #f6e8cc; border: 1px solid #d9c39a"></span>
<span style="width: 34px; height: 34px; border-radius: 4px; background: #5a2f17"></span>
<span style="font-size: 13px; line-height: 1.3; margin-left: 6px; color: #6a4a30">Mood: cozy picture book, early-evening woods.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":660}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
