<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Woodcut print</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Barlow",system-ui,sans-serif}
a{color:#7a3f14}a:hover{color:#2b1a10}
</style>
</helmet>
<div style="width: 560px; height: 660px; box-sizing: border-box; padding: 32px 40px; background: #efe3c6; color: #2b1a10; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Spectral SC', Georgia, serif; font-size: 13px; letter-spacing: 0.12em; color: #7a3f14">Look G</div>
<h1 style="margin: 0; font-family: 'Spectral SC', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.1">Woodcut print</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.4">Two or three inks, carved-looking lines, bold flat shapes, hatching cut into the shadows. Folk tale and field guide at once.</p>
</div>
<div style="display: flex; justify-content: center">
<dc-import name="Dingo" look="woodcut" hint-size="480px,400px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
<span style="width: 34px; height: 34px; border-radius: 4px; background: #c8742f"></span>
<span style="width: 34px; height: 34px; border-radius: 4px; background: #7a3f14"></span>
<span style="width: 34px; height: 34px; border-radius: 4px; background: #efe3c6; border: 1px solid #c9a56a"></span>
<span style="width: 34px; height: 34px; border-radius: 4px; background: #2b1a10"></span>
<span style="font-size: 13px; line-height: 1.3; margin-left: 6px; color: #5a4028">Mood: old bestiary pages, the Library's own art. Could be the Bestiary and card style even if the world uses another look.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":660}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
