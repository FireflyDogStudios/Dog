<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dingo generator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#8a5a2b}a:hover{color:#5a2f17}
</style>
</helmet>
<div style="width: 480px; height: 400px; background: {{S.bg}}; overflow: hidden">
<svg viewBox="0 0 480 400" width="480" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Den dingo">
<defs>
<filter id="rough-{{id}}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="{{jit}}" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<pattern id="hatch-{{id}}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="6" stroke="{{S.dark}}" stroke-width="1.3" opacity=".55"></line></pattern>
<clipPath id="body-{{id}}"><path d="{{p.torso}}"></path><path d="{{p.head}}"></path><path d="{{p.legFF}}"></path><path d="{{p.legBF}}"></path><path d="{{p.earL}}"></path><path d="{{p.earR}}"></path></clipPath>
<mask id="bm-{{id}}"><rect width="480" height="400" fill="#fff"></rect><path d="{{p.torso}}" fill="#000"></path><path d="{{p.head}}" fill="#000"></path></mask>
<radialGradient id="glow-{{id}}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="{{glowCol}}" stop-opacity=".5"></stop><stop offset="1" stop-color="{{glowCol}}" stop-opacity="0"></stop></radialGradient>
<filter id="soft-{{id}}"><feGaussianBlur stdDeviation="2.5"></feGaussianBlur></filter>
</defs>
<sc-if value="{{hasGlow}}" hint-placeholder-val="{{false}}"><ellipse cx="270" cy="220" rx="250" ry="190" fill="url(#glow-{{id}})"></ellipse></sc-if>
<ellipse cx="258" cy="352" rx="190" ry="11" fill="{{S.ground}}"></ellipse>
<g filter="{{fRough}}">
<path d="{{p.legBB}}" fill="{{S.shade}}" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{p.pawBB}}" fill="{{S.shade}}" stroke="{{S.line}}" stroke-width="{{swThin}}" stroke-linejoin="round"></path>
<path d="{{p.legFB}}" fill="{{S.shade}}" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{p.pawFB}}" fill="{{S.shade}}" stroke="{{S.line}}" stroke-width="{{swThin}}" stroke-linejoin="round"></path>
<path d="{{p.tail}}" fill="{{S.base}}" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{p.tailUnder}}" fill="{{S.buff}}" stroke="none"></path>
<path d="{{p.torso}}" fill="{{S.base}}" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{p.chest}}" fill="{{S.buff}}" stroke="none"></path>
<path d="{{p.legBF}}" fill="{{S.base}}" stroke="none"></path>
<path d="{{p.legFF}}" fill="{{S.base}}" stroke="none"></path>
<g mask="url(#bm-{{id}})">
<path d="{{p.legBF}}" fill="none" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{p.legFF}}" fill="none" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
</g>
<path d="{{p.pawBF}}" fill="{{S.base}}" stroke="{{S.line}}" stroke-width="{{swThin}}" stroke-linejoin="round"></path>
<path d="{{p.pawFF}}" fill="{{S.base}}" stroke="{{S.line}}" stroke-width="{{swThin}}" stroke-linejoin="round"></path>
<path d="{{p.earL}}" fill="{{S.base}}" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round"></path>
<path d="{{p.earR}}" fill="{{S.base}}" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round"></path>
<path d="{{p.head}}" fill="{{S.base}}" stroke="{{S.line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{p.muzzle}}" fill="{{S.buff}}" stroke="none"></path>
<path d="{{p.earInL}}" fill="{{S.buffS}}" stroke="none"></path>
<path d="{{p.earInR}}" fill="{{S.buffS}}" stroke="none"></path>
<g clip-path="url(#body-{{id}})">
<path d="{{p.shadeTorso}}" fill="{{shadeFill}}" opacity="{{shadeOp}}"></path>
<path d="{{p.shadeNeck}}" fill="{{shadeFill}}" opacity="{{shadeOp2}}"></path>
<path d="{{p.shadeHead}}" fill="{{shadeFill}}" opacity="{{shadeOp2}}"></path>
<sc-if value="{{hasLight}}" hint-placeholder-val="{{true}}"><path d="{{p.lightBack}}" fill="{{S.light}}" opacity=".8"></path></sc-if>
</g>
<path d="{{p.eye}}" fill="{{S.eye}}" stroke="{{S.dark}}" stroke-width="1.2"></path>
<circle cx="{{p.pupil.x}}" cy="{{p.pupil.y}}" r="{{p.pupil.r}}" fill="{{S.dark}}"></circle>
<sc-if value="{{hasGlow}}" hint-placeholder-val="{{false}}"><path d="{{p.eye}}" fill="{{S.eye}}" opacity=".5" filter="url(#soft-{{id}})"></path></sc-if>
<sc-if value="{{noGlow}}" hint-placeholder-val="{{true}}"><circle cx="{{p.pupil.hx}}" cy="{{p.pupil.hy}}" r="1" fill="#ffffff"></circle></sc-if>
<path d="{{p.brow}}" fill="none" stroke="{{S.line}}" stroke-width="{{swThin}}" stroke-linecap="round"></path>
<path d="{{p.nose}}" fill="{{S.dark}}" stroke="none"></path>
<path d="{{p.mouth}}" fill="none" stroke="{{S.line}}" stroke-width="{{swThin}}" stroke-linecap="round"></path>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","default":"smithy","options":["smithy","smithyScratch","scratchy","storybook","ink","pulp","woodcut"],"section":"Style"},"headK":{"editor":"range","default":1,"min":0.8,"max":1.3,"step":0.05,"section":"Proportions"},"earK":{"editor":"range","default":0.9,"min":0.7,"max":1.5,"step":0.05,"section":"Proportions"},"bodyK":{"editor":"range","default":1.05,"min":0.85,"max":1.2,"step":0.05,"section":"Proportions"},"legK":{"editor":"range","default":1,"min":0.7,"max":1.4,"step":0.05,"section":"Proportions"},"$preview":{"width":480,"height":400}}'>
/* The Den dingo v2: Carolina Dog anatomy (pointed muzzle, equilateral ears set on top pointing a little forward,
   straight back with a waist, brisket down to the elbows, straight forelegs with elbow and pastern, angulated
   hind legs with stifle and hock, fish-hook tail at about 45°, ginger with pale buff). Facing right. */
function spline(pts, closed, tension){
  tension = tension == null ? 1 : tension; var n = pts.length; if (n < 2) return "";
  var P = function(i){ return closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]; };
  var d = "M" + P(0)[0].toFixed(1) + " " + P(0)[1].toFixed(1); var m = closed ? n : n - 1;
  for (var i = 0; i < m; i++){ var p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    var c1 = [p1[0] + (p2[0] - p0[0]) / 6 * tension, p1[1] + (p2[1] - p0[1]) / 6 * tension];
    var c2 = [p2[0] - (p3[0] - p1[0]) / 6 * tension, p2[1] - (p3[1] - p1[1]) / 6 * tension];
    d += " C" + [c1[0], c1[1], c2[0], c2[1], p2[0], p2[1]].map(function(v){ return v.toFixed(1); }).join(" "); }
  return closed ? d + " Z" : d;
}
function sc(pts, cx, cy, kx, ky){ return pts.map(function(q){ return [cx + (q[0] - cx) * kx, cy + (q[1] - cy) * (ky == null ? kx : ky)]; }); }
function limb(chain, tension){ var L = [], R = [];
  for (var i = 0; i < chain.length; i++){ var x = chain[i][0], y = chain[i][1], w = chain[i][2]; var a = chain[Math.max(0, i - 1)], b = chain[Math.min(chain.length - 1, i + 1)];
    var dx = b[0] - a[0], dy = b[1] - a[1]; var len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    L.push([x - dy * w, y + dx * w]); R.push([x + dy * w, y - dx * w]); }
  return spline(L.concat(R.reverse()), true, tension == null ? 0.6 : tension); }
var LOOKS = {
  smithy:{ bg:"#efe3c6", ground:"#cdb286", base:"#c97a3a", shade:"#8f4f1f", light:"#e8a86a", buff:"#f1e1bf", buffS:"#d6bd92", dark:"#2e1c0c", line:"#2e1c0c", lineW:3.2, mode:"cel", eye:"#2a1a10" },
  smithyScratch:{ bg:"#e6d8b8", ground:"#c0a67c", base:"#c97a3a", shade:"#8f4f1f", light:"#e8a86a", buff:"#f1e1bf", buffS:"#d6bd92", dark:"#2e1c0c", line:"#2e1c0c", lineW:3.2, mode:"celhatch", jitter:1.4, eye:"#2a1a10" },
  scratchy:{ bg:"#cdbf9f", ground:"#9a8a6a", base:"#b77b47", shade:"#7d4b25", light:"#cf9a66", buff:"#d8c9a4", buffS:"#b8a888", dark:"#2b1d14", line:"#2b1d14", lineW:3.2, mode:"hatch", jitter:2.4, eye:"#1a1210" },
  storybook:{ bg:"#f3e7cf", ground:"#d9c39a", base:"#d9823c", shade:"#b25f24", light:"#efb47a", buff:"#f6e8cc", buffS:"#dcc7a0", dark:"#5a2f17", line:"#5a2f17", lineW:2.2, mode:"paint", eye:"#2a1a10" },
  ink:{ bg:"#0f1418", ground:"#1c242b", base:"#8a4a28", shade:"#4c2614", light:"#b8703c", buff:"#e9dcc0", buffS:"#b9a98a", dark:"#0a0d10", line:"#0a0d10", lineW:1.8, mode:"ink", eye:"#f2e6c8", glow:"#d9a441" },
  pulp:{ bg:"#1d2a33", ground:"#3b4f55", base:"#e4863b", shade:"#8f4518", light:"#f6b06a", buff:"#f6e4c0", buffS:"#c9b48e", dark:"#1a110c", line:"#1a110c", lineW:2.6, mode:"cel", eye:"#f6e4c0", glow:"#f2b24a" },
  woodcut:{ bg:"#efe3c6", ground:"#c9a56a", base:"#c8742f", shade:"#7a3f14", light:"#c8742f", buff:"#efe3c6", buffS:"#efe3c6", dark:"#2b1a10", line:"#2b1a10", lineW:4, mode:"cut", eye:"#efe3c6" }
};
function dingo(K){
  var p = {}, kh = K.head, ke = K.ear, kl = K.leg, kb = K.body;
  var torso = [[306,160],[250,158],[200,164],[172,176],[160,196],[166,224],[200,238],[250,250],[300,256],[330,236],[340,206],[344,176],[346,148],[338,126],[322,134]];
  p.torso = spline(sc(torso, 250, 210, 1, kb), true, 0.9);
  var hc = [372, 118], h = kh;
  var head = [[338,118],[346,96],[366,86],[388,90],[402,104],[418,116],[434,132],[436,140],[424,146],[404,150],[384,154],[362,156],[346,148],[338,134]];
  p.head = spline(head.map(function(q){ return [hc[0] + (q[0]-hc[0])*h, hc[1] + (q[1]-hc[1])*h]; }), true, 0.85);
  var ear = function(bx, by, s, fwd){ return spline([[bx - s*0.5, by], [bx + fwd*s*0.25, by - s*0.98], [bx + s*0.5, by + 2]], true, 0.35); };
  var earIn = function(bx, by, s, fwd){ return spline([[bx - s*0.28, by - 2], [bx + fwd*s*0.25, by - s*0.72], [bx + s*0.3, by]], true, 0.35); };
  var es = 34 * ke * h, E1 = [hc[0] - 14*h, hc[1] - 26*h], E2 = [hc[0] + 14*h, hc[1] - 30*h];
  p.earL = ear(E1[0], E1[1], es, 0.9); p.earR = ear(E2[0], E2[1], es, 0.6); p.earInL = earIn(E1[0], E1[1], es, 0.9); p.earInR = earIn(E2[0], E2[1], es, 0.6);
  var ex = hc[0] + 22*h, ey = hc[1] - 8*h;
  p.eye = spline([[ex-7*h, ey+1],[ex-2*h, ey-4*h],[ex+6*h, ey-3*h],[ex+8*h, ey+1],[ex+2*h, ey+4*h],[ex-4*h, ey+3*h]], true, 0.8);
  p.pupil = {x: ex + 1*h, y: ey, r: 2.6*h, hx: ex + 2*h, hy: ey - 1.5}; p.brow = "M" + (ex - 10*h) + " " + (ey - 10*h) + " q 10 -4 20 0";
  p.nose = spline([[hc[0]+58*h, hc[1]+12*h],[hc[0]+64*h, hc[1]+16*h],[hc[0]+62*h, hc[1]+23*h],[hc[0]+54*h, hc[1]+21*h]], true, 0.6);
  p.mouth = "M" + (hc[0] + 56*h) + " " + (hc[1] + 26*h) + " q -8 6 -20 4";
  p.muzzle = spline([[hc[0]+22*h, hc[1]+6*h],[hc[0]+44*h, hc[1]+8*h],[hc[0]+58*h, hc[1]+22*h],[hc[0]+44*h, hc[1]+32*h],[hc[0]+16*h, hc[1]+38*h],[hc[0]-16*h, hc[1]+34*h],[hc[0]-22*h, hc[1]+20*h],[hc[0]-2*h, hc[1]+10*h]], true, 0.9);
  var w = kl;
  var fore = function(ox){ return limb([[300+ox, 200, 15*w],[310+ox, 252, 11*w],[314+ox, 300, 8*w],[316+ox, 330, 7.5*w],[322+ox, 344, 8*w]], 0.5); };
  var hind = function(ox){ return limb([[196+ox, 196, 24*w],[204+ox, 236, 19*w],[208+ox, 262, 12*w],[184+ox, 300, 8.5*w],[184+ox, 330, 7.5*w],[190+ox, 344, 8*w]], 0.5); };
  var paw = function(x, y){ return spline([[x-10, y-6],[x+4, y-9],[x+16, y-4],[x+15, y+4],[x-9, y+5]], true, 0.8); };
  p.legFF = fore(4); p.legFB = fore(-14); p.legBF = hind(2); p.legBB = hind(-16);
  p.pawFF = paw(326, 346); p.pawFB = paw(308, 346); p.pawBF = paw(194, 346); p.pawBB = paw(176, 346);
  p.tail = limb([[166,190,9],[142,214,10],[124,246,10],[122,276,9],[134,292,7],[150,286,5]], 0.8);
  p.tailUnder = limb([[160,200,3],[140,224,4],[128,252,4],[128,276,4],[136,286,3]], 0.8);
  p.chest = spline([[340,180],[344,206],[334,232],[304,254],[252,248],[206,236],[200,224],[236,226],[290,228],[316,212],[322,186]], true, 0.9);
  p.shadeTorso = spline([[160,214],[170,250],[220,262],[300,266],[340,236],[346,210],[330,214],[300,232],[250,230],[200,222]], true, 0.9);
  p.shadeHead = spline([[336,134],[348,160],[384,162],[420,152],[438,142],[430,146],[400,144],[366,142],[344,128]], true, 0.9);
  p.shadeNeck = spline([[306,160],[320,200],[344,206],[346,150],[330,126],[314,140]], true, 0.9);
  p.lightBack = spline([[200,170],[250,164],[304,166],[318,142],[330,128],[324,132],[310,150],[300,172],[250,172],[204,178]], true, 0.9);
  return p;
}
class Component extends DCLogic {
  renderVals() {
    var look = LOOKS[this.props.look] ? this.props.look : "smithy", S = LOOKS[look];
    var K = {head: this.props.headK || 1, ear: this.props.earK || 1, body: this.props.bodyK || 1, leg: this.props.legK || 1};
    var p = dingo(K), id = look + "-" + Math.round((K.head + K.ear + K.body + K.leg) * 1000);
    var hatch = S.mode === "hatch" || S.mode === "celhatch" || S.mode === "cut";
    var shadeOp = hatch ? 1 : S.mode === "paint" ? .75 : S.mode === "ink" ? .9 : .85;
    return { S: S, p: p, id: id, sw: S.lineW, swThin: Math.max(1, S.lineW * .6), jit: (S.jitter || 0) * 2,
      fRough: S.jitter ? "url(#rough-" + id + ")" : "none",
      shadeFill: hatch ? "url(#hatch-" + id + ")" : S.shade, shadeOp: shadeOp, shadeOp2: shadeOp * .8,
      hasLight: S.mode === "cel" || S.mode === "paint" || S.mode === "celhatch",
      hasGlow: !!S.glow, noGlow: !S.glow, glowCol: S.glow || "#ffffff" };
  }
}
</script>
</body>
</html>
