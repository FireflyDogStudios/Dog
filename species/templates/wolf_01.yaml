# Body template: a real wolf photo, with landmarks read by Firefly from gridded crops (Oct 7; about +-10 px)
image: ref/research/scout/01-body-templates/wolf/01_wolf_inat130681789_RobFoster_stand_R.jpg
source: https://www.inaturalist.org/observations/79770024
author: Rob Foster (iNaturalist rob21)
licence: CC BY 4.0
facing: right
season: summer          # 21 May, moulting: Scout's summer fur offsets apply
notes: wild grey wolf, near-true profile, square stance, mouth slightly open
# photo pixels -> what each point is on the species. kind 'joint' maps to the skeleton joint; 'surface' maps to the skeleton point + skin + fur offset
landmarks:
