  eye:         {px: [1412, 405], kind: eye}
  ear_base:    {px: [1330, 300], kind: joint,   at: ear_base}
  ear_tip:     {px: [1395, 190], kind: joint,   at: ear_tip}
  occiput:     {px: [1280, 290], kind: surface, at: occiput,   dir: up,      skin: 0.008,  fur: 0.012}
  withers:     {px: [1075, 282], kind: surface, at: withers,   dir: up,      skin: 0.0267, fur: 0.040}
